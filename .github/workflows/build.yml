name: Build Tweak
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu‑24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt‑get update
          sudo apt‑get install‑y build‑essential git curl perl libtool automake autoconf ldid

      - name: Fetch Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -Lo $HOME/theos/bin/dm.pl https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl
          chmod +x $HOME/theos/bin/dm.pl

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Compile
        run: make package

      - name: Upload deb
        uses: actions/upload‑artifact@v4
        with:
          name: TweakDeb
          path: packages/*.deb
