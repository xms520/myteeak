name: Build Tweak
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Switch mirror & install deps
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo apt update
          sudo apt install -y build-essential git curl perl libtool automake autoconf

      - name: Setup Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: TweakDeb
          path: packages/*.deb
